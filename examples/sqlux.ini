SYSROM = Minerva_1.98a1.bin
ROMIM = TK236.rom
RAMTOP = 4096
FAST_STARTUP = 1
# DEVICE = FLP1,198ad.img,qdos-native
# DEVICE = WIN1,ql_demo.win,qdos-fs
DEVICE = MDV1,mdv1/,qdos-like
DEVICE = MDV2,mdv2/,qdos-like
DEVICE = MDV3,mdv3/,qdos-like
BOOT_DEVICE = MDV3
WIN_SIZE = 2x
FILTER = 1
FIXASPECT = 1
SPEED = 1
######################################################################
# QSound (AY-3-8910 / YM2149) Configuration
######################################################################
# Path to QSound expansion ROM (loaded at $0C0000)
# QSROM = qsound.rom

# QSound clock frequency in Hz (default: 750000 for standard Sinclair QL)
# QSFREQ = 750000

# Stereo panning mode:
# 0 = Mono (all channels centered)
# 1 = Stereo ABC (Channel A = Left, B = Center, C = Right)
# 2 = Stereo ACB (Channel A = Left, C = Center, B = Right)
# QSSTEREO = 1